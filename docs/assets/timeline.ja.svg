<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-label="同じ話題でも、時間は進んでいる。"><title>同じ話題でも、時間は進んでいる。</title><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102036"/><stop offset="1" stop-color="#182e45"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee0c0"/></marker></defs><rect width="1200" height="450" rx="20" fill="url(#bg)"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="44" y="42" font-size="19" font-weight="700" fill="#5ee0c0">CMCP-TIME</text><text x="44" y="91" font-size="31" font-weight="700" fill="#e8edf7">同じ話題でも、時間は進んでいる。</text><text x="44" y="123" font-size="13" font-weight="400" fill="#a5b9cc">概念を説明する例です。実モデルの応答記録ではありません</text><rect x="44" y="164" width="468" height="186" rx="15" fill="#233d54" stroke="#557086"/><text x="67" y="204" font-size="20" font-weight="700" fill="#5ee0c0">1 日目 · 21:00</text><text x="67" y="250" font-size="20" font-weight="400" fill="#e8edf7">A と B の案を比較した。</text><text x="67" y="289" font-size="20" font-weight="400" fill="#e8edf7">まだどちらも選んでいない。</text><rect x="688" y="164" width="468" height="186" rx="15" fill="#233d54" stroke="#557086"/><text x="711" y="204" font-size="20" font-weight="700" fill="#5ee0c0">2 日目 · 20:00</text><text x="711" y="250" font-size="20" font-weight="400" fill="#e8edf7">23 時間が経過した。</text><text x="711" y="289" font-size="20" font-weight="400" fill="#e8edf7">選択は未決のまま。</text><path d="M 536 258 L 663 258" fill="none" stroke="#5ee0c0" stroke-width="3" marker-end="url(#arrow)"/><text x="547" y="235" font-size="20" font-weight="700" fill="#5ee0c0">23 時間</text><text x="44" y="402" font-size="21" font-weight="400" fill="#e8edf7">原文は残し、今回必要な情報だけを戻す。</text></g></svg>
