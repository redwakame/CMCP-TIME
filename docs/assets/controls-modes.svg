<title id="title">三種日常顯示方式，控制與授權保持分離</title><desc id="desc">概念線框，不是實際 Desktop 畫面。1 最小化、2 一般單列、3 隱藏控制列；圖示位於輸入區下方，詳細內容按需開啟。隱藏顯示不等於停用，仍可使用已支援的命令入口。</desc>
