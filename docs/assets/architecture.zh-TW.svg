<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-label="歷史保留，脈絡按需選取。"><title>歷史保留，脈絡按需選取。</title><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102036"/><stop offset="1" stop-color="#182e45"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee0c0"/></marker></defs><rect width="1200" height="490" rx="20" fill="url(#bg)"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="38" y="47" font-size="28" font-weight="700" fill="#e8edf7">歷史保留，脈絡按需選取。</text><text x="38" y="77" font-size="13" font-weight="400" fill="#a5b9cc">概念責任圖，實際能力依宿主接線而定</text><rect x="38" y="119" width="247" height="114" rx="14" fill="#233d54" stroke="#557086"/><text x="54" y="162" font-size="19" font-weight="700" fill="#5ee0c0">授權原文 History</text><text x="54" y="198" font-size="16" font-weight="400" fill="#e8edf7">原文、角色、原時間</text><path d="M 292 174 L 320 174" stroke="#5ee0c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="331" y="119" width="247" height="114" rx="14" fill="#233d54" stroke="#557086"/><text x="347" y="162" font-size="19" font-weight="700" fill="#5ee0c0">時間／來源清冊</text><text x="347" y="198" font-size="16" font-weight="400" fill="#e8edf7">定位並讀取原始來源</text><path d="M 585 174 L 613 174" stroke="#5ee0c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="624" y="119" width="247" height="114" rx="14" fill="#233d54" stroke="#557086"/><text x="640" y="162" font-size="19" font-weight="700" fill="#5ee0c0">當輪必要脈絡</text><text x="640" y="198" font-size="16" font-weight="400" fill="#e8edf7">有界、可核對</text><path d="M 878 174 L 906 174" stroke="#5ee0c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="917" y="119" width="247" height="114" rx="14" fill="#233d54" stroke="#557086"/><text x="933" y="162" font-size="19" font-weight="700" fill="#5ee0c0">原本的 AI 模型</text><text x="933" y="198" font-size="16" font-weight="400" fill="#e8edf7">維持本身的推理</text><path d="M 455 237 L 455 267 L 275 267 L 275 292 M 455 267 L 880 267 L 880 292" fill="none" stroke="#5ee0c0" stroke-width="2"/><rect x="100" y="295" width="413" height="65" rx="13" fill="#233d54" stroke="#557086"/><text x="119" y="336" font-size="20" font-weight="600" fill="#e8edf7">Buffer：近期合格待續</text><rect x="686" y="295" width="413" height="65" rx="13" fill="#233d54" stroke="#557086"/><text x="705" y="336" font-size="20" font-weight="600" fill="#e8edf7">Pin：明確目標與時間</text><rect x="100" y="397" width="1000" height="51" rx="12" fill="#143f46"/><text x="121" y="430" font-size="20" font-weight="400" fill="#9aefd9">共用控制，主動推送總開關預設關閉</text></g></svg>
