<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-label="履歴は保持し、必要な文脈を選ぶ。"><title>履歴は保持し、必要な文脈を選ぶ。</title><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102036"/><stop offset="1" stop-color="#182e45"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee0c0"/></marker></defs><rect width="1200" height="490" rx="20" fill="url(#bg)"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="47" font-size="28" font-weight="700" fill="#e8edf7">履歴は保持し、必要な文脈を選ぶ。</text><text x="38" y="77" font-size="13" font-weight="400" fill="#a5b9cc">役割を示す概念図。実際の能力はホスト接続に依存</text><rect x="38" y="119" width="247" height="114" rx="14" fill="#233d54" stroke="#557086"/><text x="54" y="162" font-size="19" font-weight="700" fill="#5ee0c0">許可された原文</text><text x="54" y="198" font-size="16" font-weight="400" fill="#e8edf7">原文・役割・時刻</text><path d="M 292 174 L 320 174" stroke="#5ee0c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="331" y="119" width="247" height="114" rx="14" fill="#233d54" stroke="#557086"/><text x="347" y="162" font-size="19" font-weight="700" fill="#5ee0c0">時間・出典一覧</text><text x="347" y="198" font-size="16" font-weight="400" fill="#e8edf7">元の情報を特定</text><path d="M 585 174 L 613 174" stroke="#5ee0c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="624" y="119" width="247" height="114" rx="14" fill="#233d54" stroke="#557086"/><text x="640" y="162" font-size="19" font-weight="700" fill="#5ee0c0">必要な文脈</text><text x="640" y="198" font-size="16" font-weight="400" fill="#e8edf7">範囲を限定・確認</text><path d="M 878 174 L 906 174" stroke="#5ee0c0" stroke-width="3" marker-end="url(#arrow)"/><rect x="917" y="119" width="247" height="114" rx="14" fill="#233d54" stroke="#557086"/><text x="933" y="162" font-size="19" font-weight="700" fill="#5ee0c0">既存の AI モデル</text><text x="933" y="198" font-size="16" font-weight="400" fill="#e8edf7">本来の推論を使う</text><path d="M 455 237 L 455 267 L 275 267 L 275 292 M 455 267 L 880 267 L 880 292" fill="none" stroke="#5ee0c0" stroke-width="2"/><rect x="100" y="295" width="413" height="65" rx="13" fill="#233d54" stroke="#557086"/><text x="119" y="336" font-size="20" font-weight="600" fill="#e8edf7">Buffer：最近の継続候補</text><rect x="686" y="295" width="413" height="65" rx="13" fill="#233d54" stroke="#557086"/><text x="705" y="336" font-size="20" font-weight="600" fill="#e8edf7">Pin：明示した目標と時刻</text><rect x="100" y="397" width="1000" height="51" rx="12" fill="#143f46"/><text x="121" y="430" font-size="20" font-weight="400" fill="#9aefd9">共通の制御。自動送信は初期状態で OFF</text></g></svg>
