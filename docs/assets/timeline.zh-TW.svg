<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-label="同一段討論，時間已經往前。"><title>同一段討論，時間已經往前。</title><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102036"/><stop offset="1" stop-color="#182e45"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5ee0c0"/></marker></defs><rect width="1200" height="450" rx="20" fill="url(#bg)"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="44" y="42" font-size="19" font-weight="700" fill="#5ee0c0">CMCP-TIME</text><text x="44" y="91" font-size="31" font-weight="700" fill="#e8edf7">同一段討論，時間已經往前。</text><text x="44" y="123" font-size="13" font-weight="400" fill="#a5b9cc">概念情境示意，非模型原始對話或實測畫面</text><rect x="44" y="164" width="468" height="186" rx="15" fill="#233d54" stroke="#557086"/><text x="67" y="204" font-size="20" font-weight="700" fill="#5ee0c0">第 1 天 · 21:00</text><text x="67" y="250" font-size="20" font-weight="400" fill="#e8edf7">比較了 A 與 B 兩種方案。</text><text x="67" y="289" font-size="20" font-weight="400" fill="#e8edf7">還沒有決定採用哪個。</text><rect x="688" y="164" width="468" height="186" rx="15" fill="#233d54" stroke="#557086"/><text x="711" y="204" font-size="20" font-weight="700" fill="#5ee0c0">第 2 天 · 20:00</text><text x="711" y="250" font-size="20" font-weight="400" fill="#e8edf7">中間已經過了 23 小時。</text><text x="711" y="289" font-size="20" font-weight="400" fill="#e8edf7">方案仍待決定，不重做已交付內容。</text><path d="M 536 258 L 663 258" fill="none" stroke="#5ee0c0" stroke-width="3" marker-end="url(#arrow)"/><text x="547" y="235" font-size="20" font-weight="700" fill="#5ee0c0">23 小時</text><text x="44" y="402" font-size="21" font-weight="400" fill="#e8edf7">原話持續可查，本輪只帶回相關脈絡。</text></g></svg>
